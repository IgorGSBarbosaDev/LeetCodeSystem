spring.datasource.url=jdbc:sqlite:file:leetcodesystem-test-${random.uuid}?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
judge.execution-timeout=200ms
judge.compilation-timeout=10s
judge.max-output-bytes=65536
