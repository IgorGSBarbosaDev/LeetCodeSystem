spring.application.name=leetcodesystem

spring.datasource.url=jdbc:sqlite:./leetcodesystem.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SQLite permite uma única operação de escrita por vez.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
